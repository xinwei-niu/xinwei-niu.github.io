<div class="academic-footer">
  <p class="academic-footer-copyright">&copy; {{ site.time | date: '%Y' }} {{ site.name | default: site.title }}.</p>
  <nav class="academic-footer-links" aria-label="Footer navigation">
    {% if site.author.email %}<a href="mailto:{{ site.author.email }}">Contact</a>{% endif %}
    {% if site.author.github %}<a href="https://github.com/{{ site.author.github }}">GitHub</a>{% endif %}
    <a href="{{ '/sitemap/' | relative_url }}">Sitemap</a>
  </nav>
</div>
<p class="academic-footer-credit">Built with <a href="https://jekyllrb.com/">Jekyll</a> and <a href="https://github.com/academicpages/academicpages.github.io">AcademicPages</a>.</p>
